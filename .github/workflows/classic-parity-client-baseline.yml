name: Classic parity client baseline maintenance

on:
  push:
    branches:
      - full-classic-parity
    paths:
      - '.github/workflows/classic-parity-client-baseline.yml'

permissions:
  contents: write

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-classic-parity
      - name: Accept restored hopper client screen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('scripts/tests/client_catalog_baseline.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          hopper = 'BCFactoryGuis.MENU_HOPPER.get(),GuiHopper::new'
          tank = 'BCFactoryGuis.MENU_TANK.get(),GuiTank::new'
          changed = False
          for target, baseline in data.items():
              screens = baseline['screens']['factory/BCFactoryClientGuis.java']
              if hopper not in screens:
                  screens.insert(screens.index(tank), hopper)
                  changed = True
          if not changed:
              raise SystemExit('hopper screen baseline already present')
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/classic-parity-client-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tests/client_catalog_baseline.json .github/workflows/classic-parity-client-baseline.yml
          git commit -m "Accept restored hopper client screen baseline"
          git push origin HEAD:full-classic-parity
